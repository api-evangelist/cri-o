openapi: 3.2.0
info:
  title: CRI-O Status Information API
  description: The CRI-O Status API is an HTTP server exposed by the cri-o daemon over a Unix domain socket (default /var/run/crio/crio.sock for the gRPC CRI and /var/run/crio/crio.info for status). It provides runtime introspection endpoints for retrieving daemon configuration, version, container information, and golang debug data. As noted upstream, this API is not considered stable for production use and is intended for debugging, operations, and tooling integrations.
  version: '1.0'
  contact:
    name: CRI-O Project
    url: https://cri-o.io/
  license:
    name: Apache 2.0
    url: https://github.com/cri-o/cri-o/blob/main/LICENSE
servers:
- url: http://localhost
  description: CRI-O Status API served over the local Unix socket
tags:
- name: Information
  description: Runtime version, configuration, and general info endpoints.
paths:
  /info:
    get:
      tags:
      - Information
      operationId: getInfo
      summary: Get runtime information
      description: Returns daemon information including storage driver, storage root, cgroup driver, and runtime defaults.
      responses:
        '200':
          description: Runtime information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
  /config:
    get:
      tags:
      - Information
      operationId: getConfig
      summary: Get runtime configuration
      description: Returns the active CRI-O TOML configuration as plain text.
      responses:
        '200':
          description: TOML configuration document
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Info:
      type: object
      properties:
        storage_driver:
          type: string
        storage_root:
          type: string
        cgroup_driver:
          type: string
        default_runtime:
          type: string
        runtimes:
          type: object
          additionalProperties: true
externalDocs:
  description: CRI-O Documentation
  url: https://github.com/cri-o/cri-o/tree/main/docs
