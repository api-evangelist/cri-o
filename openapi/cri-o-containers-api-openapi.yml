openapi: 3.2.0
info:
  title: CRI-O Status Containers API
  description: The CRI-O Status API is an HTTP server exposed by the cri-o daemon over a Unix domain socket (default /var/run/crio/crio.sock for the gRPC CRI and /var/run/crio/crio.info for status). It provides runtime introspection endpoints for retrieving daemon configuration, version, container information, and golang debug data. As noted upstream, this API is not considered stable for production use and is intended for debugging, operations, and tooling integrations.
  version: '1.0'
  contact:
    name: CRI-O Project
    url: https://cri-o.io/
  license:
    name: Apache 2.0
    url: https://github.com/cri-o/cri-o/blob/main/LICENSE
servers:
- url: http://localhost
  description: CRI-O Status API served over the local Unix socket
tags:
- name: Containers
  description: Endpoints that return information about live containers.
paths:
  /containers/{id}:
    get:
      tags:
      - Containers
      operationId: getContainer
      summary: Get container info
      description: Returns runtime information about a single container by ID.
      parameters:
      - name: id
        in: path
        required: true
        description: Container ID.
        schema:
          type: string
      responses:
        '200':
          description: Container information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerInfo'
        '404':
          description: Container not found
components:
  schemas:
    ContainerInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        pid:
          type: integer
        sandbox_id:
          type: string
        created_time:
          type: string
          format: date-time
externalDocs:
  description: CRI-O Documentation
  url: https://github.com/cri-o/cri-o/tree/main/docs
