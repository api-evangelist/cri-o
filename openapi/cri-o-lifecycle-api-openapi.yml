openapi: 3.2.0
info:
  title: CRI-O Status Lifecycle API
  description: The CRI-O Status API is an HTTP server exposed by the cri-o daemon over a Unix domain socket (default /var/run/crio/crio.sock for the gRPC CRI and /var/run/crio/crio.info for status). It provides runtime introspection endpoints for retrieving daemon configuration, version, container information, and golang debug data. As noted upstream, this API is not considered stable for production use and is intended for debugging, operations, and tooling integrations.
  version: '1.0'
  contact:
    name: CRI-O Project
    url: https://cri-o.io/
  license:
    name: Apache 2.0
    url: https://github.com/cri-o/cri-o/blob/main/LICENSE
servers:
- url: http://localhost
  description: CRI-O Status API served over the local Unix socket
tags:
- name: Lifecycle
  description: Endpoints to pause and unpause running containers.
paths:
  /pause/{id}:
    post:
      tags:
      - Lifecycle
      operationId: pauseContainer
      summary: Pause a container
      description: Pauses a running container by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Container paused
        '404':
          description: Container not found
  /unpause/{id}:
    post:
      tags:
      - Lifecycle
      operationId: unpauseContainer
      summary: Unpause a container
      description: Unpauses a paused container by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Container unpaused
        '404':
          description: Container not found
externalDocs:
  description: CRI-O Documentation
  url: https://github.com/cri-o/cri-o/tree/main/docs
